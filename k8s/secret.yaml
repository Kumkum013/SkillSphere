apiVersion: v1
kind: Secret
metadata:
  name: skillsphere-secret
  namespace: skillsphere
type: Opaque
stringData:
  # JWT Secret - Strong random string for development
  JWT_SECRET: "skillsphere_jwt_secret_development_2026_secure_key"

  # GitHub OAuth Credentials - Placeholder for development
  GITHUB_CLIENT_ID: "placeholder_github_client_id"
  GITHUB_CLIENT_SECRET: "placeholder_github_client_secret"
  GITHUB_TOKEN: "placeholder_github_token"

  # Email Configuration (Optional)
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USER: "placeholder_email@gmail.com"
  EMAIL_PASS: "placeholder_password"

