apiVersion: v1
kind: ConfigMap
metadata:
  name: skillsphere-config
  namespace: skillsphere
data:
  # Backend Configuration
  PORT: "5000"
  MONGO_URI: "mongodb://mongodb-service:27017/skillsphere"
  REDIS_URL: "redis://redis-service:6379"
  FRONTEND_URL: "http://skillsphere.local"

  # GitHub Configuration (Optional - can be overridden by Secret)
  GITHUB_CALLBACK_URL: "http://skillsphere.local/api/auth/github/callback"
