apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillsphere-frontend
  namespace: skillsphere
  labels:
    app: skillsphere-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillsphere-frontend
  template:
    metadata:
      labels:
        app: skillsphere-frontend
    spec:
      containers:
      - name: frontend
        image: skillsphere-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "/api"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: skillsphere-frontend-service
  namespace: skillsphere
spec:
  selector:
    app: skillsphere-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillsphere-frontend-hpa
  namespace: skillsphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skillsphere-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
