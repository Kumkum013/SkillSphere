apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillsphere-backend
  namespace: skillsphere
  labels:
    app: skillsphere-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillsphere-backend
  template:
    metadata:
      labels:
        app: skillsphere-backend
    spec:
      containers:
      - name: backend
        image: skillsphere-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        # From ConfigMap
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: skillsphere-config
              key: PORT
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: skillsphere-config
              key: MONGO_URI
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: skillsphere-config
              key: REDIS_URL
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: skillsphere-config
              key: FRONTEND_URL
        # From Secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: JWT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: GITHUB_CLIENT_SECRET
        - name: GITHUB_CALLBACK_URL
          valueFrom:
            configMapKeyRef:
              name: skillsphere-config
              key: GITHUB_CALLBACK_URL
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: GITHUB_TOKEN
        - name: EMAIL_HOST
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: EMAIL_HOST
        - name: EMAIL_PORT
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: EMAIL_PORT
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: EMAIL_USER
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: skillsphere-secret
              key: EMAIL_PASS
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: skillsphere-backend-service
  namespace: skillsphere
spec:
  selector:
    app: skillsphere-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillsphere-backend-hpa
  namespace: skillsphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skillsphere-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
